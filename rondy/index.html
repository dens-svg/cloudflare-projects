<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Groupe RONDY</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", sans-serif; background: #f7f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .card { background: #fff; border-radius: 20px; padding: 3rem 2.5rem; text-align: center; max-width: 520px; width: 100%; box-shadow: 0 4px 32px rgba(0,0,0,0.07); }
    .logo { max-width: 260px; width: 100%; margin-bottom: 2rem; }
    .sep { width: 40px; height: 2px; background: #c8a96e; border-radius: 2px; margin: 0 auto 1.5rem; }
    .since { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #999; margin-bottom: 1rem; }
    .tagline { font-family: "Playfair Display", serif; font-size: 20px; color: #2a2a2a; line-height: 1.6; margin-bottom: 0.75rem; }
    .sub { font-size: 14px; color: #888; line-height: 1.7; }
    .link { display: inline-block; margin-top: 2rem; font-size: 13px; font-weight: 500; color: #c8a96e; text-decoration: none; letter-spacing: 0.06em; border-bottom: 1px solid #c8a96e44; padding-bottom: 2px; }
    .link:hover { color: #a8883e; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://www.groupe-rondy.com/wp-content/uploads/2024/03/logo-1-1.jpg" alt="Logo Groupe RONDY" />
    <div class="sep"></div>
    <p class="since">Depuis 1946</p>
    <p class="tagline">Un groupe familial,<br>aux fortes valeurs humaines.</p>
    <p class="sub">Acteur majeur du négoce de gros en France depuis plus de 80 ans.</p>
    <a class="link" href="https://www.groupe-rondy.com" target="_blank">www.groupe-rondy.com →</a>
  </div>
</body>
</html>
